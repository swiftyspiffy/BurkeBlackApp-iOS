name: Client auth compatibility
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify state contract
        run: |
          swiftc BurkeBlackApp/Services/MobileSessionContract.swift tests/session-contract/main.swift -o /tmp/session-contract
          /tmp/session-contract
      - name: Build for simulator without signing
        run: xcodebuild -project BurkeBlackApp.xcodeproj -scheme BurkeBlackApp -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build
