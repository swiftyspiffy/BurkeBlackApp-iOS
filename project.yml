name: BurkeBlackApp
options:
  bundleIdPrefix: com.swiftyspiffy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

targets:
  BurkeBlackApp:
    type: application
    platform: iOS
    sources:
      - BurkeBlackApp
    dependencies:
      - target: BurkeBlackNotificationService
      - target: BurkeBlackWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftyspiffy.BurkeBlackApp
        CODE_SIGN_ENTITLEMENTS: BurkeBlackApp/BurkeBlackApp.entitlements
        MARKETING_VERSION: "1.6"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: "42P2RC3MX3"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: BurkeBlackApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Select photos to attach to your feedback"
        INFOPLIST_KEY_CFBundleDisplayName: "Dirty Skull"

  BurkeBlackWidget:
    type: app-extension
    platform: iOS
    sources:
      - BurkeBlackWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftyspiffy.BurkeBlackApp.Widget
        PRODUCT_NAME: BurkeBlackWidget
        MARKETING_VERSION: "1.6"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: "42P2RC3MX3"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: BurkeBlackWidget/BurkeBlackWidget.entitlements
        INFOPLIST_FILE: BurkeBlackWidget/Info.plist
        SKIP_INSTALL: YES

  BurkeBlackNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - BurkeBlackNotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftyspiffy.BurkeBlackApp.NotificationService
        PRODUCT_NAME: BurkeBlackNotificationService
        MARKETING_VERSION: "1.6"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: "42P2RC3MX3"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: BurkeBlackNotificationService/BurkeBlackNotificationService.entitlements
        INFOPLIST_FILE: BurkeBlackNotificationService/Info.plist
        SKIP_INSTALL: YES
